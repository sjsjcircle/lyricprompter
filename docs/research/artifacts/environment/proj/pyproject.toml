[project]
name = "lyricprompter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # core numeric / audio
  "numpy>=2.4,<2.6",
  "scipy>=1.17,<1.19",
  "numba>=0.67,<0.69",
  "librosa>=1.0,<1.1",
  "soundfile>=0.13,<0.15",
  "soxr>=1.0,<1.2",
  "sounddevice>=0.5.2,<0.6",
  # ML
  "torch>=2.13,<2.15",
  "torchaudio==2.11.0",        # last release; forward-compatible with torch >=2.11
  "torchcodec>=0.17,<0.18",    # torchaudio.load/save + ctc-forced-aligner deps; needs FFmpeg 4-9 shared libs
  "transformers>=5.19,<6",
  "onnxruntime>=1.31,<1.32",   # ships CoreMLExecutionProvider on macOS arm64
  # offline prep
  "audio-separator[cpu]>=0.47,<0.48",
  "audioread>=3.0",            # audio-separator imports it but no longer gets it via librosa 1.0
  "ctc-forced-aligner",        # NOTE: resolved from git (MahmoudAshraf97), see [tool.uv.sources]
  "uroman>=1.3.1.1",
  # text / syllables
  "pyphen>=0.18",
  "cmudict>=1.1.3",
  "pykakasi>=2.3",
  "fugashi>=1.5",
  "unidic-lite>=1.0.8",
  "jamo>=0.4.1",
  # server
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.uv]
# Lock only for this machine class (avoids solving CUDA/Linux/Windows branches)
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# audio-separator pins samplerate==0.1.0 whose bundled libsamplerate.dylib is x86_64-only
override-dependencies = ["samplerate>=0.2.4"]

[tool.uv.sources]
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git", rev = "64293cc6d711e57666c4a8b098e9fd93b381fd88" }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
