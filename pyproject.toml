[project]
name = "lyricprompter"
version = "0.1.0"
description = "Automatic multilingual (ko/ja/en) lyrics prompter: offline separation + forced alignment, live audio-to-audio tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # numeric / audio
  "numpy>=2.4,<2.6",
  "scipy>=1.17,<1.19",
  "librosa>=0.11,<1.1",
  "soundfile>=0.13,<0.15",
  "soxr>=1.0,<1.2",
  "sounddevice>=0.5.2,<0.6",
  # ML (offline prep on MPS)
  "torch>=2.13,<2.15",
  "torchaudio==2.11.0",          # last release; MMS_FA + forced_align, forward-compatible with torch>=2.11
  "transformers>=5.19,<6",       # Qwen3-ForcedAligner (windowed refinement)
  # vocal separation
  "audio-separator[cpu]>=0.47,<0.48",
  "audioread>=3.0",              # imported by audio-separator but not declared
  # lyrics text front-end
  "uroman>=1.3.1.1",
  "pyopenjtalk-plus>=0.4.1.post9",
  "cmudict>=1.1.3",
  "pyphen>=0.18",
  # server
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "python-multipart>=0.0.20",
  "regex>=2026.9.29",
  "num2words>=0.5.14",
]

[project.scripts]
lyricprompter = "lyricprompter.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "httpx>=0.28"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# audio-separator pins samplerate==0.1.0 whose bundled libsamplerate.dylib is x86_64-only
override-dependencies = ["samplerate>=0.2.4"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: needs model downloads / real audio (deselect with -m 'not slow')",
]
